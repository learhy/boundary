syntax = "proto3";

package postgres.v1;

option go_package = "github.com/hashicorp/boundary/internal/bsr/gen/postgres/v1";

// DataChunk is a raw byte chunk for unparsed or non-auditable PostgreSQL messages.
message DataChunk {
  // The raw bytes of the PostgreSQL wire protocol message.
  bytes data = 1;

  // The direction the message was travelling when recorded.
  // "up" = client to backend; "down" = backend to client.
  string direction = 2;
}

// StartupChunk contains sanitized startup message parameters.
// Credentials (password) are consumed by the proxy and not stored here.
message StartupChunk {
  // The user connecting to the database.
  string user = 1;

  // The database being connected to.
  string database = 2;

  // Additional startup parameters (application_name, client_encoding, etc.).
  map<string, string> options = 3;
}

// AuthChunk contains the authentication method and outcome.
message AuthChunk {
  // The authentication method used.
  // One of: "cleartext", "md5", "scram-sha-256", "unspecified".
  string method = 1;

  // Whether authentication succeeded.
  bool success = 2;

  // Error message if authentication failed.
  string error = 3;
}

// QueryChunk contains a simple SQL query from a client Query message.
message QueryChunk {
  // The SQL query string.
  string query = 1;

  // The database this query was run against.
  string database = 2;
}

// ParseChunk contains a prepared statement parse message from the client.
message ParseChunk {
  // The name of the prepared statement.
  string statement_name = 1;

  // The SQL query string for the prepared statement.
  string query = 2;

  // The database this statement was parsed against.
  string database = 3;
}

// BindChunk contains a bind message with parameter values.
// Uses the resolved SQL from a prior ParseChunk by statement name.
message BindChunk {
  // The name of the prepared statement to execute.
  string statement_name = 1;

  // The name of the portal to create.
  string portal_name = 2;

  // The resolved SQL query from the named prepared statement.
  string query = 3;

  // Parameter values provided by the client.
  repeated bytes param_values = 4;

  // Parameter type OIDs (PostgreSQL type system).
  repeated uint32 param_types = 5;

  // The database this bind was issued against.
  string database = 6;
}

// BindResponseChunk is the backend's response to a Bind message.
message BindResponseChunk {
  // True if the bind succeeded.
  bool success = 1;

  // Error message if the bind failed.
  string error = 2;
}

// ExecuteChunk contains an execute message specifying which portal to run.
message ExecuteChunk {
  // The name of the portal to execute.
  string portal_name = 1;

  // Maximum number of rows to return (0 = all rows).
  uint32 max_rows = 2;
}

// ExecuteResponseChunk is the backend's response to an Execute message.
message ExecuteResponseChunk {
  // Number of rows processed (INSERT/UPDATE/DELETE) or returned (SELECT).
  int64 rows_affected = 1;

  // True if execution resulted in an error.
  bool error = 2;

  // Error message if execution failed.
  string error_message = 3;
}

// ParseCompleteChunk indicates a Parse message was successfully processed.
message ParseCompleteChunk {
  // Placeholder; PostgreSQL sends no payload for ParseComplete.
}

// SyncChunk indicates a Sync message, ending an implicit transaction block.
message SyncChunk {
  // Placeholder; PostgreSQL Sync has no payload.
}

// ErrorChunk contains a PostgreSQL ErrorResponse.
message ErrorChunk {
  // Severity: ERROR, FATAL, PANIC, WARNING, NOTICE, etc.
  string severity = 1;

  // SQLSTATE code.
  string code = 2;

  // Human-readable error message.
  string message = 3;

  // Additional detail (optional).
  string detail = 4;

  // Hint (optional).
  string hint = 5;
}

// DoneChunk indicates normal session termination.
message DoneChunk {
  // The reason for termination.
  // One of: "normal", "client_disconnect", "server_disconnect", "timeout".
  string reason = 1;
}